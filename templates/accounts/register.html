{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 sm:p-10 rounded-3xl shadow-sm border border-slate-100 my-6">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-black text-slate-900 mb-2">انضم إلى EduPoint 🚀</h1>
        <p class="text-slate-500 text-sm">أنشئ حسابك بالبريد الإلكتروني وابدأ التعلم فوراً</p>
    </div>
    
    {% if error %}
    <div class="bg-rose-50 border border-rose-100 text-rose-600 px-4 py-3 rounded-2xl mb-6 text-sm font-semibold text-center">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">البريد الإلكتروني</label>
            <input type="email" name="email" required placeholder="name@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition font-medium">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">كلمة المرور</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition font-medium">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">نوع الحساب</label>
            <select name="user_type" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition font-medium">
                <option value="student">طالب (أريد التعلم واكتساب مهارات)</option>
                <option value="instructor">مدرس (أريد رفع وإنشاء كورسات)</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold py-3.5 rounded-2xl hover:opacity-95 transition shadow-lg shadow-indigo-200">
            إنشاء الحساب الان ✨
        </button>
    </form>

    <!-- زر التسجيل السريع عبر جوجل -->
    <div class="mt-6">
        <div class="relative flex justify-center text-sm mb-4">
            <span class="px-2 bg-white text-slate-400 font-medium">أو التسجيل باستخدام</span>
        </div>
        <a href="/accounts/google/login/" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 text-slate-700 font-bold py-3.5 rounded-2xl hover:bg-slate-50 transition shadow-sm">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.14v3.15C3.16 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.14C.41 8.1 0 9.79 0 12s.41 3.9 1.14 5.4l4.14-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.16 2.68 1.14 6.6l4.14 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/></svg>
            <span>التسجيل بواسطة حساب جوجل 🌐</span>
        </a>
    </div>
    
    <p class="text-center text-sm text-slate-500 mt-6">
        لديك حساب بالفعل؟ <a href="{% url 'login' %}" class="text-indigo-600 font-bold hover:underline">سجل دخولك الآن</a>
    </p>
</div>
{% endblock %}
