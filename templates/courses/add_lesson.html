{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 sm:p-10 rounded-3xl shadow-sm border border-slate-100 my-6">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-black text-slate-900 mb-2">إضافة درس جديد 🎬</h1>
        <p class="text-slate-500 text-sm">للكورس: <span class="font-bold text-indigo-600">{{ course.title }}</span></p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">عنوان الدرس</label>
            <input type="text" name="title" placeholder="مثال: مقدمة وقواعد أساسية" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition font-medium">
        </div>
        
        <!-- حقل رفع ملف الفيديو المباشر -->
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">رفع ملف الفيديو مباشرة (MP4)</label>
            <input type="file" name="video_file" accept="video/*" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-slate-800 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 transition font-medium">
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">أو رابط فيديو خارجي (YouTube) - اختيار بديل</label>
            <input type="url" name="video_url" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition font-medium">
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">وصف الدرس أو ملاحظات</label>
            <textarea name="description" rows="3" placeholder="اكتب وصفاً أو تفاصيل سريعة حول هذا الدرس..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition font-medium resize-none"></textarea>
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">ملفات مرفقة مع الدرس (PDF, ZIP...)</label>
            <input type="file" name="attachment" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-slate-800 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 transition font-medium">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">ترتيب الدرس (رقم)</label>
            <input type="number" name="order" value="1" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition font-medium">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold py-3.5 rounded-2xl hover:opacity-95 transition shadow-lg shadow-indigo-200">
            إضافة الدرس للمحتوى 📺
        </button>
    </form>
</div>
{% endblock %}
