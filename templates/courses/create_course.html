{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 sm:p-10 rounded-3xl shadow-sm border border-slate-100 my-6">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-black text-slate-900 mb-2">إنشاء كورس تعليمي جديد 📚</h1>
        <p class="text-slate-500 text-sm">شارك خبرتك وعلّم آلاف الطلاب حول العالم</p>
    </div>

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">عنوان الكورس</label>
            <input type="text" name="title" placeholder="مثال: احتراف تطوير الويب بلغة بايثون" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition font-medium">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">وصف الكورس</label>
            <textarea name="description" rows="4" placeholder="اكتب نبذة تفصيلية عما سيستفيده الطالب في هذا الكورس..." required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition font-medium resize-none"></textarea>
        </div>
        <div class="flex items-center space-x-reverse space-x-3 bg-slate-50 p-4 rounded-2xl border border-slate-100">
            <input type="checkbox" name="is_free" id="is_free" checked class="w-5 h-5 text-indigo-600 rounded-lg accent-indigo-600">
            <label for="is_free" class="text-sm font-bold text-slate-700 cursor-pointer">هذا الكورس مجاني بالكامل</label>
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">سعر الكورس (لو لم يكن مجانياً)</label>
            <input type="number" step="0.01" name="price" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition font-medium">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold py-3.5 rounded-2xl hover:opacity-95 transition shadow-lg shadow-indigo-200">
            حفظ ونشر الكورس 🚀
        </button>
    </form>
</div>
{% endblock %}
