{% extends 'base.html' %}
{% block title %}تعديل الكورس - EduPoint{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 sm:p-10 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 my-4 sm:my-8">
    <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-3xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto text-3xl mb-4 shadow-inner">
            ✏️
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 mb-2">تعديل بيانات الكورس</h1>
        <p class="text-slate-500 text-xs sm:text-sm font-semibold">تحديث تفاصيل كورس: <span class="font-bold text-indigo-600">{{ course.title }}</span></p>
    </div>

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-2">عنوان الكورس</label>
            <input type="text" name="title" value="{{ course.title }}" required class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-3 text-slate-800 text-sm font-semibold focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-2">وصف الكورس</label>
            <textarea name="description" rows="4" required class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-3 text-slate-800 text-sm font-semibold focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none resize-none">{{ course.description }}</textarea>
        </div>
        <div class="flex items-center space-x-reverse space-x-3 bg-slate-50 p-4 rounded-2xl border border-slate-200/80">
            <input type="checkbox" name="is_free" id="is_free" {% if course.is_free %}checked{% endif %} class="w-5 h-5 text-indigo-600 rounded-lg accent-indigo-600 cursor-pointer">
            <label for="is_free" class="text-xs sm:text-sm font-bold text-slate-700 cursor-pointer">هذا الكورس مجاني بالكامل</label>
        </div>
        <div>
            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-2">سعر الكورس (جنيه)</label>
            <input type="number" step="0.01" name="price" value="{{ course.price }}" class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-3 text-slate-800 text-sm font-semibold focus:ring-4 focus:ring-indigo-100 outline-none">
        </div>
        <div class="flex gap-3">
            <button type="submit" class="flex-1 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 text-sm hover:opacity-95 transition">
                حفظ التعديلات ✨
            </button>
            <a href="{% url 'instructor_dashboard' %}" class="px-6 py-3.5 rounded-2xl border border-slate-200 text-slate-600 font-bold text-sm hover:bg-slate-50 transition text-center">
                إلغاء
            </a>
        </div>
    </form>
</div>
{% endblock %}
